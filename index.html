<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能管家個人面板 | Butler Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --card-bg: #ffffff;
      --accent: #3b82f6;
      --spotify-green: #1db954;
      --spotify-green-dark: #1aa34a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 20px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-main);
    }

    .app-frame {
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .container { 
      padding: 24px; 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
      overflow-y: auto; 
    }

    .butler-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff; 
      padding: 20px 26px; 
      border-radius: var(--radius);
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      box-shadow: var(--shadow);
    }
    
    .btn-speech { 
      background: rgba(255, 255, 255, 0.1); 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      color: white; 
      padding: 8px 16px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 0.85rem; 
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-speech:hover { background: rgba(255, 255, 255, 0.25); }

    /* 上方 Spotify 互動面板網格 */
    .dashboard-top-grid { 
      display: grid; 
      grid-template-columns: 1fr 440px; 
      gap: 20px; 
    }
    
    .spotify-dashboard-card {
      background: var(--card-bg); 
      padding: 20px; 
      border-radius: var(--radius); 
      box-shadow: var(--shadow);
      display: flex; 
      flex-direction: column; 
      gap: 12px;
      min-height: 440px;
    }

    .login-bar {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding-bottom: 10px; 
      border-bottom: 1px solid var(--border-color);
    }

    .btn-spotify-login {
      background: var(--spotify-green); 
      color: white; 
      border: none;
      padding: 7px 16px; 
      border-radius: 20px; 
      font-weight: 600; 
      font-size: 0.82rem; 
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-spotify-login:hover { background: var(--spotify-green-dark); }

    .spotify-tabs { display: flex; gap: 8px; }
    .tab-btn { 
      background: #f1f5f9; 
      border: none; 
      padding: 8px 14px; 
      border-radius: 8px; 
      font-size: 0.82rem; 
      cursor: pointer; 
      font-weight: 600; 
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--text-main); color: white; }

    .tab-content { display: none; height: 300px; overflow-y: auto; }
    .tab-content.active { display: block; }

    .item-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .item-row { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 10px 12px; 
      background: #f8fafc; 
      border-radius: 10px; 
      font-size: 0.82rem; 
      cursor: pointer; 
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .item-row:hover { 
      background: #f1f5f9; 
      border-color: var(--border-color);
    }
    .item-row.playing {
      background: #f0fdf4;
      border-color: var(--spotify-green);
    }

    /* 右側 Spotify 播放器與專屬控制面板區 */
    .spotify-player-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .spotify-embed-card {
      background: #000000; 
      padding: 8px; 
      border-radius: var(--radius); 
      box-shadow: var(--shadow);
      display: flex; 
      align-items: center; 
      justify-content: center;
      position: relative;
    }

    /* 🎮 專屬控制按鈕列 (Custom Controller Bar) */
    .custom-control-bar {
      background: #18181b;
      border-radius: 16px;
      padding: 14px 16px;
      color: white;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #a1a1aa;
    }

    .now-playing-badge {
      background: rgba(29, 185, 84, 0.15);
      color: #4ade80;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .control-buttons-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex: 1;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: #3f3f46;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .ctrl-btn-random {
      background: linear-gradient(135deg, #1db954 0%, #059669 100%);
      border: none;
      color: white;
      font-weight: 700;
      flex: 1.4;
    }
    .ctrl-btn-random:hover {
      background: linear-gradient(135deg, #1aa34a 0%, #047857 100%);
    }

    .preset-playlists-bar {
      display: flex;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid #27272a;
      overflow-x: auto;
    }

    .preset-chip {
      background: #27272a;
      color: #d4d4d8;
      border: none;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .preset-chip:hover {
      background: #3f3f46;
      color: #ffffff;
    }

    /* 4大功能卡片 */
    .grid-hub { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 20px; 
    }
    .hub-card { 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      padding: 24px; 
      box-shadow: var(--shadow); 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .hub-card:hover { 
      transform: translateY(-3px); 
      border: 1px solid var(--accent); 
    }
    .hub-card .card-icon { 
      width: 45px; 
      height: 45px; 
      border-radius: 12px; 
      background: #eff6ff; 
      color: var(--accent); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.3rem; 
      margin-bottom: 12px; 
    }

    .page-view { 
      display: none; 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      padding: 30px; 
      box-shadow: var(--shadow); 
    }
    .page-view.active { display: block; }
    .page-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 20px; 
      padding-bottom: 12px; 
      border-bottom: 1px solid var(--border-color); 
    }
    .btn-back { 
      background: #f1f5f9; 
      border: none; 
      padding: 8px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 500; 
    }

    .task-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .task-input-group input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 10px; outline: none; }
    .task-input-group button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border-color); }
    .task-item.completed span { text-decoration: line-through; color: var(--text-muted); }

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 15px; }
    .cat-media-card { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #e2e8f0; }
    .cat-media-card img { width: 100%; height: 100%; object-fit: cover; }

    /* 閒置待機全螢幕 */
    .ambient-overlay {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      background: #090d16; 
      color: #ffffff; 
      z-index: 999; 
      display: flex;
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.8s ease; 
      padding: 40px; 
      text-align: center;
    }
    .ambient-overlay.active { opacity: 1; pointer-events: auto; }
    .ambient-clock { font-size: 6rem; font-weight: 300; letter-spacing: -2px; margin-bottom: 10px; color: #fff; }
    .ambient-date { font-size: 1.5rem; color: #94a3b8; margin-bottom: 30px; }
  </style>
</head>
<body>

  <div class="app-frame" id="appFrame">

    <!-- 閒置待機畫面 -->
    <div class="ambient-overlay" id="ambientOverlay" onclick="wakeUp()">
      <div class="ambient-clock" id="ambientClock">12:00:00</div>
      <div class="ambient-date" id="ambientDate">2026年10月25日</div>
      <div style="font-size: 0.9rem; color: #64748b;">點擊畫面任意處喚醒管家</div>
    </div>

    <div class="container">
      
      <div class="butler-header">
        <div>
          <h1 id="greetingText" style="font-size: 1.4rem; margin-bottom: 4px;">🤖 早安，主人</h1>
          <p id="butlerSummary" style="color: #94a3b8; font-size: 0.85rem;">載入今日數據中...</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn-speech" onclick="triggerIdleNow()">🌙 待機模式</button>
          <button class="btn-speech" onclick="speakButlerSummary()">🔊 語音簡報</button>
        </div>
      </div>

      <!-- 主頁 View -->
      <div id="homePage">
        
        <!-- 上方 Spotify API + 內嵌播放器控制卡片 -->
        <div class="dashboard-top-grid">
          
          <div class="spotify-dashboard-card">
            <div class="login-bar">
              <span id="userStatus" style="font-size: 0.85rem; font-weight: 600;">未登入 Spotify</span>
              <button class="btn-spotify-login" id="loginBtn" onclick="loginSpotify()">🟢 登入 Spotify</button>
            </div>

            <div class="spotify-tabs">
              <button class="tab-btn active" onclick="switchTab('playlistsTab', this)">📚 我的歌單</button>
              <button class="tab-btn" onclick="switchTab('searchTab', this)">🔍 搜尋歌曲</button>
            </div>

            <!-- 分頁 1: 我的歌單 -->
            <div id="playlistsTab" class="tab-content active">
              <ul class="item-list" id="playlistsList">
                <li style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 20px;">點擊「登入 Spotify」即可載入個人歌單</li>
              </ul>
            </div>

            <!-- 分頁 2: 關鍵字搜尋 -->
            <div id="searchTab" class="tab-content">
              <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                <input type="text" id="searchInput" placeholder="搜尋歌名 / 歌手..." style="flex:1; padding:8px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:0.8rem; outline:none;" onkeydown="if(event.key==='Enter') searchSpotify()">
                <button onclick="searchSpotify()" style="background:#1db954; color:white; border:none; padding:8px 14px; border-radius:8px; font-weight:600; font-size:0.8rem; cursor:pointer;">搜尋</button>
              </div>
              <ul class="item-list" id="searchResults">
                <li style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 10px;">輸入關鍵字搜尋 Spotify 音樂</li>
              </ul>
            </div>
          </div>

          <!-- 右側內嵌播放器 + 專屬控制按鈕列 -->
          <div class="spotify-player-container">
            <div class="spotify-embed-card">
              <iframe id="spotifyPlayer" 
                      style="border-radius:12px" 
                      src="https://open.spotify.com/embed/playlist/37i9dQZF1DX4sWSpwq3LiO?utm_source=generator" 
                      width="100%" 
                      height="230" 
                      frameBorder="0" 
                      allowfullscreen="" 
                      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                      loading="lazy">
              </iframe>
            </div>

            <!-- 🎮 專屬控制按鈕列 -->
            <div class="custom-control-bar">
              <div class="control-status-row">
                <span>🎛️ 歌單內曲目控制器</span>
                <span id="nowPlayingBadge" class="now-playing-badge">載入中...</span>
              </div>

              <div class="control-buttons-grid">
                <button class="ctrl-btn" onclick="playPreviousTrack()" title="播放歌單內的上一首">⏮️ 上一首</button>
                <button class="ctrl-btn ctrl-btn-random" onclick="playRandomTrackInPlaylist()" title="從當前歌單內隨機抽取一首歌曲播放">🔀 歌單內隨機抽歌</button>
                <button class="ctrl-btn" onclick="playNextTrack()" title="播放歌單內的下一首">⏭️ 下一首</button>
              </div>

              <!-- 📂 預設熱門歌單快捷按鈕 -->
              <div class="preset-playlists-bar">
                <span style="font-size: 0.7rem; color: #a1a1aa; align-self: center;">熱門歌單：</span>
                <button class="preset-chip" onclick="loadPlaylistAndFetchTracks('37i9dQZF1DX4sWSpwq3LiO', 'Today\'s Top Hits')">🔥 Today's Top Hits</button>
                <button class="preset-chip" onclick="loadPlaylistAndFetchTracks('37i9dQZF1DX3rxVfI13C2p', 'Chill Hits')">☕ Chill Hits</button>
                <button class="preset-chip" onclick="loadPlaylistAndFetchTracks('37i9dQZF1DX0X333A39A6A', 'Workday Lounge')">🎧 專注工作</button>
              </div>
            </div>
          </div>

        </div>

        <!-- 4大卡片 -->
        <div class="grid-hub" style="margin-top: 20px;">
          <div class="hub-card" onclick="showPage('taskPage')">
            <div class="card-icon">✅</div>
            <h3>每日 Task List</h3>
            <p>記錄運動、練琴等每日習慣進度</p>
          </div>
          <div class="hub-card" onclick="showPage('catPage')">
            <div class="card-icon">🐱</div>
            <h3>主子影音牆</h3>
            <p>記錄貓咪的日常照片與可愛影片</p>
          </div>
          <div class="hub-card" style="opacity: 0.5; cursor: default;">
            <div class="card-icon">📊</div>
            <h3>習慣數據統計</h3>
            <p>（預留模組）</p>
          </div>
          <div class="hub-card" style="opacity: 0.5; cursor: default;">
            <div class="card-icon">⚙️</div>
            <h3>管家系統設定</h3>
            <p>（預留模組）</p>
          </div>
        </div>

      </div>

      <!-- 頁面 2: Task List -->
      <div id="taskPage" class="page-view">
        <div class="page-header">
          <h2>✅ 每日任務 Task List</h2>
          <button class="btn-back" onclick="showPage('homePage')">← 返回主頁</button>
        </div>
        <div class="task-input-group">
          <input type="text" id="newTaskInput" placeholder="輸入新的每日習慣...">
          <button onclick="addTask()">新增任務</button>
        </div>
        <ul class="task-list" id="taskListContainer"></ul>
      </div>

      <!-- 頁面 3: 貓咪牆 -->
      <div id="catPage" class="page-view">
        <div class="page-header">
          <h2>🐱 貓咪照片 & 影片牆</h2>
          <button class="btn-back" onclick="showPage('homePage')">← 返回主頁</button>
        </div>
        <div class="cat-grid">
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&q=80"></div>
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&q=80"></div>
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&q=80"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 🔑 請在此處輸入你在 Spotify Developer Dashboard 申請的 Client ID
    const SPOTIFY_CLIENT_ID = '8324dfb33f7d4fee83b146d1a1934381'; 
    const REDIRECT_URI = 'https://my-web.fktimchoi.workers.dev/index.html';

    let accessToken = localStorage.getItem('spotify_access_token') || '';
    
    // 核心資料陣列：存放當前歌單內的「所有單曲 (TRACKS)」
    let currentPlaylistTracks = [];
    let currentTrackIndex = -1;
    let activePlaylistName = "預設熱門歌單";

    // PKCE 安全授權流程
    async function loginSpotify() {
      if (SPOTIFY_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
        alert('請先在 index.html 裡面填入你的 SPOTIFY_CLIENT_ID！');
        return;
      }

      const verifier = generateRandomString(128);
      const challenge = await generateCodeChallenge(verifier);
      localStorage.setItem('verifier', verifier);

      const scopes = 'user-read-private user-read-email playlist-read-private';
      const params = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: scopes,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      document.location = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function handleAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        const verifier = localStorage.getItem('verifier');
        const params = new URLSearchParams({
          client_id: SPOTIFY_CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        });

        try {
          const res = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
          });

          const data = await res.json();
          if (data.access_token) {
            accessToken = data.access_token;
            localStorage.setItem('spotify_access_token', accessToken);
            window.history.replaceState({}, document.title, REDIRECT_URI);
            loadUserData();
          }
        } catch (e) {
          console.error('授權失敗', e);
        }
      } else if (accessToken) {
        loadUserData();
      }
    }

    async function loadUserData() {
      try {
        const userRes = await fetch('https://api.spotify.com/v1/me', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (userRes.ok) {
          const userData = await userRes.json();
          document.getElementById('userStatus').innerText = `👤 ${userData.display_name}`;
          document.getElementById('loginBtn').style.display = 'none';
          fetchUserPlaylists();
        }
      } catch (err) {
        console.error('使用者資料載入失敗', err);
      }
    }

    // 取得使用者的歌單列表
    async function fetchUserPlaylists() {
      try {
        const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=20', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        const listContainer = document.getElementById('playlistsList');
        listContainer.innerHTML = '';

        if (data.items && data.items.length > 0) {
          data.items.forEach((playlist) => {
            const li = document.createElement('li');
            li.className = 'item-row';
            li.innerHTML = `
              <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:210px;">
                📂 <strong>${playlist.name}</strong>
              </div>
              <button style="background:#1db954; color:white; border:none; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:0.75rem;">選擇歌單</button>
            `;
            li.onclick = () => loadPlaylistAndFetchTracks(playlist.id, playlist.name);
            listContainer.appendChild(li);
          });

          // 預設載入第一個歌單裡面的單曲
          loadPlaylistAndFetchTracks(data.items[0].id, data.items[0].name);
        } else {
          listContainer.innerHTML = '<li style="color:var(--text-muted); font-size:0.8rem; text-align:center;">找不到個人歌單</li>';
        }
      } catch (e) {
        console.error('歌單讀取失敗', e);
      }
    }

    // 關鍵字搜尋歌曲
    async function searchSpotify() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query || !accessToken) return;

      const resultsList = document.getElementById('searchResults');
      resultsList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.8rem; text-align: center;">搜尋中...</li>';

      try {
        const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=20`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        const tracks = data.tracks.items;

        resultsList.innerHTML = '';
        currentPlaylistTracks = tracks.map(t => ({
          id: t.id,
          name: t.name,
          artist: t.artists.map(a => a.name).join(', ')
        }));

        activePlaylistName = `搜尋：「${query}」`;

        tracks.forEach((track, index) => {
          const li = document.createElement('li');
          li.className = 'item-row';
          const artistName = track.artists.map(a => a.name).join(', ');
          li.innerHTML = `
            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;">
              🎵 <strong>${track.name}</strong> <span style="color: var(--text-muted); font-size: 0.75rem;">${artistName}</span>
            </div>
            <button style="background: #1db954; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;">播放</button>
          `;
          li.onclick = () => playSingleTrackByIndex(index);
          resultsList.appendChild(li);
        });

        if (tracks.length > 0) {
          playSingleTrackByIndex(0);
        }
      } catch (err) {
        console.error('搜尋失敗', err);
      }
    }

    // 核心功能 1：載入歌單並透過 API 抓取「歌單內的所有單曲」
    async function loadPlaylistAndFetchTracks(playlistId, playlistName) {
      activePlaylistName = playlistName;
      document.getElementById('nowPlayingBadge').innerText = `📂 歌單：${playlistName} (載入曲目中...)`;
      
      // 先把歌單 iframe 載入顯示
      document.getElementById('spotifyPlayer').src = `https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator`;

      if (!accessToken) {
        document.getElementById('nowPlayingBadge').innerText = `📂 ${playlistName} (請先登入以解鎖抽歌)`;
        return;
      }

      try {
        const res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=50`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          currentPlaylistTracks = data.items
            .filter(item => item.track && item.track.id)
            .map(item => ({
              id: item.track.id,
              name: item.track.name,
              artist: item.track.artists.map(a => a.name).join(', ')
            }));

          currentTrackIndex = 0;
          document.getElementById('nowPlayingBadge').innerText = `📂 ${playlistName} (已載入 ${currentPlaylistTracks.length} 首歌曲)`;
        }
      } catch (e) {
        console.error('讀取歌單內單曲失敗:', e);
      }
    }

    // 核心功能 2：歌單內「隨機抽歌」 (Random Song inside Playlist)
    function playRandomTrackInPlaylist() {
      if (!currentPlaylistTracks || currentPlaylistTracks.length === 0) {
        alert('當前歌單尚未載入曲目，請先登入 Spotify 或選擇包含歌曲的歌單！');
        return;
      }

      const randomIndex = Math.floor(Math.random() * currentPlaylistTracks.length);
      playSingleTrackByIndex(randomIndex, true);
    }

    // 播放指定索引的單曲
    function playSingleTrackByIndex(index, isRandom = false) {
      if (index < 0 || index >= currentPlaylistTracks.length) return;
      
      currentTrackIndex = index;
      const track = currentPlaylistTracks[index];

      // 載入單曲至 iframe
      document.getElementById('spotifyPlayer').src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&autoplay=1`;
      
      // 更新狀態標籤 UI
      const prefix = isRandom ? '🎲 隨機播放' : '🎵 正在播放';
      document.getElementById('nowPlayingBadge').innerText = `${prefix}：${track.name} - ${track.artist}`;
    }

    function playNextTrack() {
      if (currentPlaylistTracks.length === 0) return;
      const nextIndex = (currentTrackIndex + 1) % currentPlaylistTracks.length;
      playSingleTrackByIndex(nextIndex);
    }

    function playPreviousTrack() {
      if (currentPlaylistTracks.length === 0) return;
      const prevIndex = (currentTrackIndex - 1 + currentPlaylistTracks.length) % currentPlaylistTracks.length;
      playSingleTrackByIndex(prevIndex);
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    // PKCE 加解密工具
    function generateRandomString(length) {
      let text = '';
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
      }
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // 任務與待機控制
    let tasks = JSON.parse(localStorage.getItem('butler_tasks')) || [
      { id: 1, text: '今日運動打卡 🏋️', completed: false },
      { id: 2, text: '練琴 30 分鐘 🎹', completed: false },
      { id: 3, text: '閱讀 20 頁書 📚', completed: false }
    ];

    const IDLE_TIMEOUT = 10 * 60 * 1000;
    let idleTimer;

    function init() {
      updateGreeting();
      renderTasks();
      updateButlerSummary();
      startClockUpdates();
      resetIdleTimer();
      handleAuthCallback();

      ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
        window.addEventListener(evt, resetIdleTimer, true);
      });
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.getElementById('ambientOverlay').classList.add('active');
      }, IDLE_TIMEOUT);
    }

    function triggerIdleNow() { document.getElementById('ambientOverlay').classList.add('active'); }
    function wakeUp() { document.getElementById('ambientOverlay').classList.remove('active'); resetIdleTimer(); }

    function startClockUpdates() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('ambientClock').innerText = now.toTimeString().split(' ')[0];
        document.getElementById('ambientDate').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      }, 1000);
    }

    function updateGreeting() {
      const hour = new Date().getHours();
      let greeting = '早安，主人 ☀️';
      if (hour >= 12 && hour < 18) greeting = '下午好，主人 ☕';
      else if (hour >= 18) greeting = '晚上好，主人 🌙';
      document.getElementById('greetingText').innerText = greeting;
    }

    function showPage(pageId) {
      document.getElementById('homePage').style.display = pageId === 'homePage' ? 'block' : 'none';
      document.getElementById('taskPage').classList.toggle('active', pageId === 'taskPage');
      document.getElementById('catPage').classList.toggle('active', pageId === 'catPage');
    }

    function renderTasks() {
      const container = document.getElementById('taskListContainer');
      container.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <span>${task.text}</span>
          <input type="checkbox" style="width:20px;height:20px;cursor:pointer;" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
        `;
        container.appendChild(li);
      });
      localStorage.setItem('butler_tasks', JSON.stringify(tasks));
      updateButlerSummary();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      renderTasks();
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      if (!input.value.trim()) return;
      tasks.push({ id: Date.now(), text: input.value.trim(), completed: false });
      input.value = '';
      renderTasks();
    }

    function updateButlerSummary() {
      const completed = tasks.filter(t => t.completed).length;
      document.getElementById('butlerSummary').innerText = `今日習慣完成進度：${completed} / ${tasks.length} 項。`;
    }

    function speakButlerSummary() {
      const text = document.getElementById('greetingText').innerText + '。' + document.getElementById('butlerSummary').innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    }

    window.onload = init;
  </script>
</body>
