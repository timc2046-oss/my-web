<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能管家個人面板 | Butler Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --card-bg: #ffffff;
      --accent: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 20px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0d1117; color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 10px; }

    /* 頂部視角切換 */
    .viewport-controls { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.1); padding: 6px; border-radius: 30px; }
    .device-btn { background: transparent; border: none; color: #94a3b8; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
    .device-btn.active { background: #ffffff; color: #0f172a; font-weight: 600; }

    .app-frame {
      width: 1024px; min-height: 768px; background: var(--bg-primary);
      border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
    }
    .app-frame.tablet-portrait { width: 768px; min-height: 1024px; }
    .app-frame.desktop { width: 100%; max-width: 1200px; }
    .app-frame.mobile { width: 390px; min-height: 844px; border-radius: 40px; }

    .container { padding: 30px; flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }

    .butler-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff; padding: 20px 24px; border-radius: var(--radius);
      display: flex; justify-content: space-between; align-items: center;
    }
    .btn-speech { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; }

    /* Spotify 搜尋與播放區塊 */
    .dashboard-top-grid { display: grid; grid-template-columns: 1fr 360px; gap: 20px; margin-bottom: 20px; }
    .spotify-search-box {
      background: var(--card-bg); padding: 16px; border-radius: var(--radius); box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 10px; justify-content: space-between;
    }
    .search-input-group { display: flex; gap: 8px; }
    .search-input-group input { flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.9rem; outline: none; }
    .search-input-group button { background: #1db954; color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    
    .search-results { max-height: 110px; overflow-y: auto; list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .search-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #f8fafc; border-radius: 8px; font-size: 0.82rem; cursor: pointer; }
    .search-item:hover { background: #e2e8f0; }

    .spotify-widget { background: #000; border-radius: var(--radius); overflow: hidden; height: 165px; }

    .grid-hub { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .hub-card { background: var(--card-bg); border-radius: var(--radius); padding: 25px; box-shadow: var(--shadow); cursor: pointer; transition: 0.2s; }
    .hub-card:hover { transform: translateY(-3px); border: 1px solid var(--accent); }
    .hub-card .card-icon { width: 45px; height: 45px; border-radius: 12px; background: #eff6ff; color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 12px; }

    .page-view { display: none; background: var(--card-bg); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); }
    .page-view.active { display: block; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .btn-back { background: #f1f5f9; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }

    .task-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .task-input-group input { flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 10px; outline: none; }
    .task-input-group button { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border-color); }
    .task-item.completed span { text-decoration: line-through; color: var(--text-muted); }

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
    .cat-media-card { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #e2e8f0; }
    .cat-media-card img { width: 100%; height: 100%; object-fit: cover; }

    /* 閒置畫面 */
    .ambient-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #090d16; color: #ffffff; z-index: 999; display: flex;
      flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.8s ease; padding: 40px; text-align: center;
    }
    .ambient-overlay.active { opacity: 1; pointer-events: auto; }
    .ambient-clock { font-size: 5.5rem; font-weight: 300; letter-spacing: -2px; margin-bottom: 10px; color: #fff; }
    .ambient-date { font-size: 1.3rem; color: #94a3b8; margin-bottom: 30px; }
  </style>
</head>
<body>

  <div class="viewport-controls">
    <button class="device-btn" onclick="setDevice('desktop')">💻 Desktop</button>
    <button class="device-btn active" onclick="setDevice('tablet-landscape')">📱 Tablet (橫)</button>
    <button class="device-btn" onclick="setDevice('tablet-portrait')">📱 Tablet (直)</button>
    <button class="device-btn" onclick="setDevice('mobile')">📱 Mobile</button>
  </div>

  <div class="app-frame" id="appFrame">

    <!-- 閒置待機畫面 -->
    <div class="ambient-overlay" id="ambientOverlay" onclick="wakeUp()">
      <div class="ambient-clock" id="ambientClock">12:00:00</div>
      <div class="ambient-date" id="ambientDate">2026年10月25日</div>
      <div style="font-size: 0.85rem; color: #64748b;">點擊畫面任意處喚醒管家</div>
    </div>

    <div class="container">
      
      <div class="butler-header">
        <div>
          <h1 id="greetingText" style="font-size: 1.3rem; margin-bottom: 4px;">🤖 早安，主人</h1>
          <p id="butlerSummary" style="color: #94a3b8; font-size: 0.85rem;">載入今日數據中...</p>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn-speech" onclick="triggerIdleNow()">🌙 測試閒置</button>
          <button class="btn-speech" onclick="speakButlerSummary()">🔊 語音簡報</button>
        </div>
      </div>

      <!-- 主頁 View -->
      <div id="homePage">
        
        <!-- Spotify 搜尋與播放面板 -->
        <div class="dashboard-top-grid">
          <div class="spotify-search-box">
            <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">🔍 Spotify 搜尋播放器</div>
            <div class="search-input-group">
              <input type="text" id="searchInput" placeholder="輸入歌名/歌手 (例: 楓 周杰倫)..." onkeydown="if(event.key==='Enter') searchSpotify()">
              <button onclick="searchSpotify()">搜尋</button>
            </div>
            <ul class="search-results" id="searchResults">
              <li style="color: var(--text-muted); font-size: 0.78rem; text-align: center; padding: 10px;">輸入關鍵字搜尋並點擊播放</li>
            </ul>
          </div>

          <div class="spotify-widget">
            <iframe id="spotifyPlayer" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX4sWSpwq3LiO?utm_source=generator" width="100%" height="165" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
          </div>
        </div>

        <!-- 4大卡片 -->
        <div class="grid-hub">
          <div class="hub-card" onclick="showPage('taskPage')">
            <div class="card-icon">✅</div>
            <h3>每日 Task List</h3>
            <p>記錄運動、練琴等每日習慣進度</p>
          </div>
          <div class="hub-card" onclick="showPage('catPage')">
            <div class="card-icon">🐱</div>
            <h3>主子影音牆</h3>
            <p>記錄貓咪的日常照片與可愛影片</p>
          </div>
          <div class="hub-card" style="opacity: 0.5; cursor: default;">
            <div class="card-icon">📊</div>
            <h3>習慣數據統計</h3>
            <p>（預留模組）</p>
          </div>
          <div class="hub-card" style="opacity: 0.5; cursor: default;">
            <div class="card-icon">⚙️</div>
            <h3>管家系統設定</h3>
            <p>（預留模組）</p>
          </div>
        </div>

      </div>

      <!-- 頁面 2: Task List -->
      <div id="taskPage" class="page-view">
        <div class="page-header">
          <h2>✅ 每日任務 Task List</h2>
          <button class="btn-back" onclick="showPage('homePage')">← 返回主頁</button>
        </div>
        <div class="task-input-group">
          <input type="text" id="newTaskInput" placeholder="輸入新的每日習慣...">
          <button onclick="addTask()">新增任務</button>
        </div>
        <ul class="task-list" id="taskListContainer"></ul>
      </div>

      <!-- 頁面 3: 貓咪牆 -->
      <div id="catPage" class="page-view">
        <div class="page-header">
          <h2>🐱 貓咪照片 & 影片牆</h2>
          <button class="btn-back" onclick="showPage('homePage')">← 返回主頁</button>
        </div>
        <div class="cat-grid">
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&q=80"></div>
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&q=80"></div>
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&q=80"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 🔑 請把你在 Spotify Developer 取得的金鑰貼在下面：
    const SPOTIFY_CLIENT_ID = '8324dfb33f7d4fee83b146d1a1934381';        // <-- 替換成你的 Client ID
    const SPOTIFY_CLIENT_SECRET = 'b5ec98dbed7f49c3a309fd3ead2ca921'; // <-- 替換成你的 Client Secret

    let accessToken = '';

    // 自動取得 Spotify Token
    async function getSpotifyToken() {
      if (SPOTIFY_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') return;
      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Authorization': 'Basic ' + btoa(SPOTIFY_CLIENT_ID + ':' + SPOTIFY_CLIENT_SECRET)
          },
          body: 'grant_type=client_credentials'
        });
        const data = await response.json();
        accessToken = data.access_token;
      } catch (err) {
        console.error('取得 Spotify Token 失敗', err);
      }
    }

    // Spotify 搜尋功能
    async function searchSpotify() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      if (SPOTIFY_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
        alert('⚠️ 請先在 index.html 程式碼中填入你的 SPOTIFY_CLIENT_ID 與 SPOTIFY_CLIENT_SECRET！');
        return;
      }

      if (!accessToken) {
        await getSpotifyToken();
        if (!accessToken) {
          alert('⚠️ 無法取得 Spotify 授權，請檢查 Client ID 與 Secret 是否正確！');
          return;
        }
      }

      const resultsList = document.getElementById('searchResults');
      resultsList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.78rem; text-align: center; padding: 10px;">搜尋中...</li>';

      try {
        const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=4`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });

        if (!res.ok) throw new Error(`API 錯誤 HTTP ${res.status}`);

        const data = await res.json();
        const tracks = data.tracks.items;

        resultsList.innerHTML = '';
        if (tracks.length === 0) {
          resultsList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.78rem; text-align: center; padding: 10px;">找不到相關歌曲</li>';
          return;
        }

        tracks.forEach(track => {
          const li = document.createElement('li');
          li.className = 'search-item';
          const artistName = track.artists.map(a => a.name).join(', ');
          li.innerHTML = `
            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;">
              <strong>${track.name}</strong> <span style="color: var(--text-muted);">${artistName}</span>
            </div>
            <button style="background: #1db954; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;">播放</button>
          `;
          li.onclick = () => playTrack(track.id);
          resultsList.appendChild(li);
        });
      } catch (err) {
        console.error('搜尋失敗', err);
        alert('搜尋失敗：' + err.message + '\n請確認網頁是否透過 Live Server 等本機伺服器開啟。');
      }
    }

    // 升級版：點擊搜尋結果後，自動以「專輯/歌單」或「單曲嵌入」模式載入，並在右側播放器顯示相關曲目
    function playTrack(trackId) {
      const iframe = document.getElementById('spotifyPlayer');
      // 將播放器改為載入該歌曲的互動頁面，保留內嵌互動控制
      iframe.src = `[https://open.spotify.com/](https://open.spotify.com/)`;
    }

    // 任務與閒置控制邏輯
    let tasks = JSON.parse(localStorage.getItem('butler_tasks')) || [
      { id: 1, text: '今日運動打卡 🏋️', completed: false },
      { id: 2, text: '練琴 30 分鐘 🎹', completed: false },
      { id: 3, text: '閱讀 20 頁書 📚', completed: false }
    ];

    const IDLE_TIMEOUT = 10 * 60 * 1000;
    let idleTimer;

    function init() {
      updateGreeting();
      renderTasks();
      updateButlerSummary();
      startClockUpdates();
      resetIdleTimer();
      getSpotifyToken();

      ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
        window.addEventListener(evt, resetIdleTimer, true);
      });
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.getElementById('ambientOverlay').classList.add('active');
      }, IDLE_TIMEOUT);
    }

    function triggerIdleNow() {
      document.getElementById('ambientOverlay').classList.add('active');
    }

    function wakeUp() {
      document.getElementById('ambientOverlay').classList.remove('active');
      resetIdleTimer();
    }

    function startClockUpdates() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('ambientClock').innerText = now.toTimeString().split(' ')[0];
        document.getElementById('ambientDate').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      }, 1000);
    }

    function setDevice(mode) {
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('appFrame').className = 'app-frame ' + mode;
    }

    function updateGreeting() {
      const hour = new Date().getHours();
      let greeting = '早安，主人 ☀️';
      if (hour >= 12 && hour < 18) greeting = '下午好，主人 ☕';
      else if (hour >= 18) greeting = '晚上好，主人 🌙';
      document.getElementById('greetingText').innerText = greeting;
    }

    function showPage(pageId) {
      document.getElementById('homePage').style.display = pageId === 'homePage' ? 'block' : 'none';
      document.getElementById('taskPage').classList.toggle('active', pageId === 'taskPage');
      document.getElementById('catPage').classList.toggle('active', pageId === 'catPage');
    }

    function renderTasks() {
      const container = document.getElementById('taskListContainer');
      container.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <span>${task.text}</span>
          <input type="checkbox" style="width:20px;height:20px;cursor:pointer;" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
        `;
        container.appendChild(li);
      });
      localStorage.setItem('butler_tasks', JSON.stringify(tasks));
      updateButlerSummary();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      renderTasks();
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      if (!input.value.trim()) return;
      tasks.push({ id: Date.now(), text: input.value.trim(), completed: false });
      input.value = '';
      renderTasks();
    }

    function updateButlerSummary() {
      const completed = tasks.filter(t => t.completed).length;
      document.getElementById('butlerSummary').innerText = `今日習慣完成進度：${completed} / ${tasks.length} 項。`;
    }

    function speakButlerSummary() {
      const text = document.getElementById('greetingText').innerText + '。' + document.getElementById('butlerSummary').innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    }

    window.onload = init;
  </script>
</body>
</html>
