<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能管家個人面板 | Butler Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --card-bg: #ffffff;
      --accent: #3b82f6;
      --netflix-red: #e50914;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 20px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-main);
    }

    .app-frame {
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .container { 
      padding: 30px; 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
      overflow-y: auto; 
    }

    .butler-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff; 
      padding: 24px 30px; 
      border-radius: var(--radius);
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }
    .btn-speech { 
      background: rgba(255, 255, 255, 0.1); 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      color: white; 
      padding: 10px 18px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 0.9rem; 
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-speech:hover { background: rgba(255, 255, 255, 0.2); }

    /* FlixPatrol Netflix 卡片區塊 */
    .netflix-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .netflix-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .netflix-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .netflix-badge {
      background: var(--netflix-red);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .btn-flixpatrol {
      background: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-flixpatrol:hover { background: #334155; }

    .top10-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      list-style: none;
    }

    .top10-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      transition: transform 0.2s;
    }
    .top10-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .top10-rank {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--netflix-red);
      min-width: 24px;
      text-align: center;
    }

    .top10-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 4大功能卡片網格 */
    .grid-hub { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 20px; 
    }
    .hub-card { 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      padding: 25px; 
      box-shadow: var(--shadow); 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .hub-card:hover { 
      transform: translateY(-3px); 
      border: 1px solid var(--accent); 
    }
    .hub-card .card-icon { 
      width: 45px; 
      height: 45px; 
      border-radius: 12px; 
      background: #eff6ff; 
      color: var(--accent); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.3rem; 
      margin-bottom: 12px; 
    }

    .page-view { 
      display: none; 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      padding: 30px; 
      box-shadow: var(--shadow); 
    }
    .page-view.active { display: block; }
    .page-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 20px; 
      padding-bottom: 12px; 
      border-bottom: 1px solid var(--border-color); 
    }
    .btn-back { 
      background: #f1f5f9; 
      border: none; 
      padding: 8px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 500; 
    }

    .task-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .task-input-group input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 10px; outline: none; }
    .task-input-group button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border-color); }
    .task-item.completed span { text-decoration: line-through; color: var(--text-muted); }

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 15px; }
    .cat-media-card { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #e2e8f0; }
    .cat-media-card img { width: 100%; height: 100%; object-fit: cover; }

    /* 閒置待機畫面 (全螢幕) */
    .ambient-overlay {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      background: #090d16; 
      color: #ffffff; 
      z-index: 999; 
      display: flex;
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.8s ease; 
      padding: 40px; 
      text-align: center;
    }
    .ambient-overlay.active { opacity: 1; pointer-events: auto; }
    .ambient-clock { font-size: 6rem; font-weight: 300; letter-spacing: -2px; margin-bottom: 10px; color: #fff; }
    .ambient-date { font-size: 1.5rem; color: #94a3b8; margin-bottom: 30px; }
  </style>
</head>
<body>

  <div class="app-frame" id="appFrame">

    <!-- 閒置待機畫面 -->
    <div class="ambient-overlay" id="ambientOverlay" onclick="wakeUp()">
      <div class="ambient-clock" id="ambientClock">12:00:00</div>
      <div class="ambient-date" id="ambientDate">2026年10月26日</div>
      <div style="font-size: 0.9rem; color: #64748b;">點擊畫面任意處喚醒管家</div>
    </div>

    <div class="container">
      
      <!-- 管家頂部標題區 -->
      <div class="butler-header">
        <div>
          <h1 id="greetingText" style="font-size: 1.5rem; margin-bottom: 4px;">🤖 早安，主人</h1>
          <p id="butlerSummary" style="color: #94a3b8; font-size: 0.9rem;">載入今日數據中...</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn-speech" onclick="triggerIdleNow()">🌙 測試閒置</button>
          <button class="btn-speech" onclick="speakButlerSummary()">🔊 語音簡報</button>
        </div>
      </div>

      <!-- 主頁 View -->
      <div id="homePage" style="display: flex; flex-direction: column; gap: 20px;">
        
        <!-- 🎬 FlixPatrol Netflix 香港 Top 10 熱門電影卡片 -->
        <div class="netflix-card">
          <div class="netflix-header">
            <div class="netflix-title">
              <span class="netflix-badge">NETFLIX</span>
              <span id="netflixStatusText">🇭🇰 香港區 Top 10 熱門電影 (載入中...)</span>
            </div>
            <a href="https://flixpatrol.com/top10/netflix/hong-kong/" target="_blank" class="btn-flixpatrol">
              🌐 開啟 FlixPatrol 原頁面 ↗
            </a>
          </div>

          <div class="top10-grid" id="netflixTop10List">
            <!-- JavaScript 爬蟲結果動態渲染 -->
          </div>
            <a href="https://flixpatrol.com/top10/netflix/hong-kong/" target="_blank" class="btn-flixpatrol">
              🌐 開啟 FlixPatrol 原頁面 ↗
            </a>
          </div>

          <ul class="top10-list" id="netflixTop10List">
            <!-- JavaScript 動態帶入 -->
          </ul>
        </div>

        <!-- 4大功能卡片 -->
        <div class="grid-hub">
          <div class="hub-card" onclick="showPage('taskPage')">
            <div class="card-icon">✅</div>
            <h3>每日 Task List</h3>
            <p>記錄運動、練琴等每日習慣進度</p>
          </div>
          <div class="hub-card" onclick="showPage('catPage')">
            <div class="card-icon">🐱</div>
            <h3>主子影音牆</h3>
            <p>記錄貓咪的日常照片與可愛影片</p>
          </div>
          <div class="hub-card" style="opacity: 0.5; cursor: default;">
            <div class="card-icon">📊</div>
            <h3>習慣數據統計</h3>
            <p>（預留模組）</p>
          </div>
          <div class="hub-card" style="opacity: 0.5; cursor: default;">
            <div class="card-icon">⚙️</div>
            <h3>管家系統設定</h3>
            <p>（預留模組）</p>
          </div>
        </div>

      </div>

      <!-- 頁面 2: Task List -->
      <div id="taskPage" class="page-view">
        <div class="page-header">
          <h2>✅ 每日任務 Task List</h2>
          <button class="btn-back" onclick="showPage('homePage')">← 返回主頁</button>
        </div>
        <div class="task-input-group">
          <input type="text" id="newTaskInput" placeholder="輸入新的每日習慣...">
          <button onclick="addTask()">新增任務</button>
        </div>
        <ul class="task-list" id="taskListContainer"></ul>
      </div>

      <!-- 頁面 3: 貓咪牆 -->
      <div id="catPage" class="page-view">
        <div class="page-header">
          <h2>🐱 貓咪照片 & 影片牆</h2>
          <button class="btn-back" onclick="showPage('homePage')">← 返回主頁</button>
        </div>
        <div class="cat-grid">
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&q=80" alt="Cat"></div>
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&q=80" alt="Cat"></div>
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&q=80" alt="Cat"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 🌐 向 Cloudflare Worker 的爬蟲 API 呼叫獲取最新排名
    async function loadRealtimeNetflixTop10() {
      const statusText = document.getElementById('netflixStatusText');
      const container = document.getElementById('netflixTop10List');

      try {
        const res = await fetch('/api/netflix-top10');
        if (res.ok) {
          const movies = await res.json();
          if (Array.isArray(movies) && movies.length > 0) {
            statusText.innerText = '🇭🇰 香港區 Top 10 熱門電影 (已自動更新)';
            renderNetflixTop10(movies);
            return;
          }
        }
      } catch (err) {
        console.warn('呼叫 API 失敗:', err);
      }

      // 若抓取失敗或無資料，顯示錯誤提示訊息而非 hardcode 數據
      showFetchError();
    }

    function showFetchError() {
      const statusText = document.getElementById('netflixStatusText');
      const container = document.getElementById('netflixTop10List');
      
      statusText.innerText = '🇭🇰 香港區 Top 10 熱門電影';
      container.innerHTML = `
        <div style="grid-column: 1 / -1; padding: 40px 20px; text-align: center; background: #fef2f2; border: 1px dashed #fca5a5; border-radius: 12px; color: #dc2626;">
          <div style="font-size: 1.8rem; margin-bottom: 8px;">⚠️</div>
          <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">資料未能下載成功</div>
          <div style="font-size: 0.85rem; color: #991b1b;">無法從 FlixPatrol 取得最新的 Netflix 香港區 Top 10 熱門電影數據。</div>
          <button onclick="loadRealtimeNetflixTop10()" style="margin-top: 12px; background: #dc2626; color: white; border: none; padding: 6px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">重新嘗試</button>
        </div>
      `;
    }

    function renderNetflixTop10(movies) {
      const container = document.getElementById('netflixTop10List');
      container.innerHTML = '';

      movies.forEach(item => {
        const div = document.createElement('div');
        div.className = 'top10-card';
        div.innerHTML = `
          <div class="top10-poster-wrap">
            <span class="top10-rank-badge">NO.${item.rank}</span>
            <img src="${item.poster}" alt="${item.titleCn}" loading="lazy">
          </div>
          <div class="top10-info">
            <div class="top10-cn-title" title="${item.titleCn}">${item.titleCn}</div>
            <div class="top10-en-title" title="${item.titleEn}">${item.titleEn}</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    let tasks = JSON.parse(localStorage.getItem('butler_tasks')) || [
      { id: 1, text: '今日運動打卡 🏋️', completed: false },
      { id: 2, text: '練琴 30 分鐘 🎹', completed: false },
      { id: 3, text: '閱讀 20 頁書 📚', completed: false }
    ];

    // 閒置 10 分鐘自動進入待機時鐘
    const IDLE_TIMEOUT = 10 * 60 * 1000;
    let idleTimer;

    function init() {
      updateGreeting();
      renderTasks();
      updateButlerSummary();
      renderNetflixTop10();
      startClockUpdates();
      resetIdleTimer();

      ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
        window.addEventListener(evt, resetIdleTimer, true);
      });
    }

    // 閒置計時與待機畫面控制
    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.getElementById('ambientOverlay').classList.add('active');
      }, IDLE_TIMEOUT);
    }

    function triggerIdleNow() { document.getElementById('ambientOverlay').classList.add('active'); }
    function wakeUp() { document.getElementById('ambientOverlay').classList.remove('active'); resetIdleTimer(); }

    // 時鐘更新
    function startClockUpdates() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('ambientClock').innerText = now.toTimeString().split(' ')[0];
        document.getElementById('ambientDate').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      }, 1000);
    }

    // 問候語更新
    function updateGreeting() {
      const hour = new Date().getHours();
      let greeting = '早安，主人 ☀️';
      if (hour >= 12 && hour < 18) greeting = '下午好，主人 ☕';
      else if (hour >= 18) greeting = '晚上好，主人 🌙';
      document.getElementById('greetingText').innerText = greeting;
    }

    // 頁面切換控制
    function showPage(pageId) {
      document.getElementById('homePage').style.display = pageId === 'homePage' ? 'flex' : 'none';
      document.getElementById('taskPage').classList.toggle('active', pageId === 'taskPage');
      document.getElementById('catPage').classList.toggle('active', pageId === 'catPage');
    }

    // Task List 任務管理
    function renderTasks() {
      const container = document.getElementById('taskListContainer');
      container.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <span>${task.text}</span>
          <input type="checkbox" style="width:20px;height:20px;cursor:pointer;" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
        `;
        container.appendChild(li);
      });
      localStorage.setItem('butler_tasks', JSON.stringify(tasks));
      updateButlerSummary();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      renderTasks();
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      if (!input.value.trim()) return;
      tasks.push({ id: Date.now(), text: input.value.trim(), completed: false });
      input.value = '';
      renderTasks();
    }

    function updateButlerSummary() {
      const completed = tasks.filter(t => t.completed).length;
      document.getElementById('butlerSummary').innerText = `今日習慣完成進度：${completed} / ${tasks.length} 項。`;
    }

    // 語音簡報 (Web Speech API)
    function speakButlerSummary() {
      const text = document.getElementById('greetingText').innerText + '。' + document.getElementById('butlerSummary').innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    }

    window.onload = init;
  </script>
</body>
</html>
