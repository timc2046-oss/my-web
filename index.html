<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能管家個人面板 | Butler Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --card-bg: #ffffff;
      --accent: #3b82f6;
      --spotify-green: #1db954;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 20px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    /* 讓 body 100% 填滿整個瀏覽器畫面，不留黑邊 */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-main);
    }

    .app-frame {
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .container { 
      padding: 30px; 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
      overflow-y: auto; 
    }

    .butler-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff; 
      padding: 24px 30px; 
      border-radius: var(--radius);
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }
    .btn-speech { 
      background: rgba(255, 255, 255, 0.1); 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      color: white; 
      padding: 10px 18px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 0.9rem; 
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-speech:hover { background: rgba(255, 255, 255, 0.2); }

    /* 上方 Spotify 互動面板網格 */
    .dashboard-top-grid { 
      display: grid; 
      grid-template-columns: 1fr 380px; 
      gap: 20px; 
      margin-bottom: 20px; 
    }
    
    .spotify-dashboard-card {
      background: var(--card-bg); 
      padding: 20px; 
      border-radius: var(--radius); 
      box-shadow: var(--shadow);
      display: flex; 
      flex-direction: column; 
      gap: 12px;
    }

    .login-bar {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding-bottom: 8px; 
      border-bottom: 1px solid var(--border-color);
    }

    .btn-spotify-login {
      background: var(--spotify-green); 
      color: white; 
      border: none;
      padding: 6px 14px; 
      border-radius: 20px; 
      font-weight: 600; 
      font-size: 0.8rem; 
      cursor: pointer;
    }

    .spotify-tabs { display: flex; gap: 8px; }
    .tab-btn { 
      background: #f1f5f9; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 8px; 
      font-size: 0.8rem; 
      cursor: pointer; 
      font-weight: 600; 
      color: var(--text-muted);
    }
    .tab-btn.active { background: var(--text-main); color: white; }

    .tab-content { display: none; max-height: 110px; overflow-y: auto; }
    .tab-content.active { display: block; }

    .item-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .item-row { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 8px 10px; 
      background: #f8fafc; 
      border-radius: 8px; 
      font-size: 0.82rem; 
      cursor: pointer; 
    }
    .item-row:hover { background: #e2e8f0; }

    .spotify-embed-card {
      background: #000000; 
      padding: 10px; 
      border-radius: var(--radius); 
      box-shadow: var(--shadow);
      display: flex; 
      align-items: center; 
      justify-content: center;
    }

    /* 4大功能卡片 */
    .grid-hub { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 20px; 
    }
    .hub-card { 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      padding: 25px; 
      box-shadow: var(--shadow); 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .hub-card:hover { 
      transform: translateY(-3px); 
      border: 1px solid var(--accent); 
    }
    .hub-card .card-icon { 
      width: 45px; 
      height: 45px; 
      border-radius: 12px; 
      background: #eff6ff; 
      color: var(--accent); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.3rem; 
      margin-bottom: 12px; 
    }

    .page-view { 
      display: none; 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      padding: 30px; 
      box-shadow: var(--shadow); 
    }
    .page-view.active { display: block; }
    .page-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 20px; 
      padding-bottom: 12px; 
      border-bottom: 1px solid var(--border-color); 
    }
    .btn-back { 
      background: #f1f5f9; 
      border: none; 
      padding: 8px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 500; 
    }

    .task-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .task-input-group input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 10px; outline: none; }
    .task-input-group button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border-color); }
    .task-item.completed span { text-decoration: line-through; color: var(--text-muted); }

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 15px; }
    .cat-media-card { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #e2e8f0; }
    .cat-media-card img { width: 100%; height: 100%; object-fit: cover; }

    /* 閒置畫面 (全螢幕) */
    .ambient-overlay {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      background: #090d16; 
      color: #ffffff; 
      z-index: 999; 
      display: flex;
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.8s ease; 
      padding: 40px; 
      text-align: center;
    }
    .ambient-overlay.active { opacity: 1; pointer-events: auto; }
    .ambient-clock { font-size: 6rem; font-weight: 300; letter-spacing: -2px; margin-bottom: 10px; color: #fff; }
    .ambient-date { font-size: 1.5rem; color: #94a3b8; margin-bottom: 30px; }
  </style>
</head>
<body>

  <div class="app-frame" id="appFrame">

    <!-- 閒置待機畫面 -->
    <div class="ambient-overlay" id="ambientOverlay" onclick="wakeUp()">
      <div class="ambient-clock" id="ambientClock">12:00:00</div>
      <div class="ambient-date" id="ambientDate">2026年10月25日</div>
      <div style="font-size: 0.9rem; color: #64748b;">點擊畫面任意處喚醒管家</div>
    </div>

    <div class="container">
      
      <div class="butler-header">
        <div>
          <h1 id="greetingText" style="font-size: 1.5rem; margin-bottom: 4px;">🤖 早安，主人</h1>
          <p id="butlerSummary" style="color: #94a3b8; font-size: 0.9rem;">載入今日數據中...</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn-speech" onclick="triggerIdleNow()">🌙 測試閒置</button>
          <button class="btn-speech" onclick="speakButlerSummary()">🔊 語音簡報</button>
        </div>
      </div>

      <!-- 主頁 View -->
      <div id="homePage">
        
        <!-- 上方 Spotify API + 內嵌播放器控制卡片 -->
        <div class="dashboard-top-grid">
          
          <div class="spotify-dashboard-card">
            <div class="login-bar">
              <span id="userStatus" style="font-size: 0.85rem; font-weight: 600;">未登入 Spotify</span>
              <button class="btn-spotify-login" id="loginBtn" onclick="loginSpotify()">🟢 登入 Spotify</button>
            </div>

            <div class="spotify-tabs">
              <button class="tab-btn active" onclick="switchTab('playlistsTab', this)">📚 我的歌單</button>
              <button class="tab-btn" onclick="switchTab('searchTab', this)">🔍 搜尋歌曲</button>
            </div>

            <!-- 分頁 1: 我的歌單 -->
            <div id="playlistsTab" class="tab-content active">
              <ul class="item-list" id="playlistsList">
                <li style="color: var(--text-muted); font-size: 0.78rem; text-align: center; padding: 10px;">點擊「登入 Spotify」即可載入個人歌單</li>
              </ul>
            </div>

            <!-- 分頁 2: 關鍵字搜尋 -->
            <div id="searchTab" class="tab-content">
              <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                <input type="text" id="searchInput" placeholder="搜尋歌名 / 歌手..." style="flex:1; padding:6px 10px; border:1px solid #e2e8f0; border-radius:6px; font-size:0.8rem; outline:none;" onkeydown="if(event.key==='Enter') searchSpotify()">
                <button onclick="searchSpotify()" style="background:#1db954; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:600; font-size:0.8rem; cursor:pointer;">搜尋</button>
              </div>
              <ul class="item-list" id="searchResults">
                <li style="color: var(--text-muted); font-size: 0.78rem; text-align: center;">輸入關鍵字搜尋 Spotify 音樂</li>
              </ul>
            </div>
          </div>

          <!-- 右側嵌入式播放器 (點擊左側項目會自動更換播放網址) -->
          <div class="spotify-embed-card">
            <iframe id="spotifyPlayer" 
                    style="border-radius:12px" 
                    src="https://open.spotify.com/embed/playlist/37i9dQZF1DX4sWSpwq3LiO?utm_source=generator" 
                    width="100%" 
                    height="152" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
            </iframe>
          </div>

        </div>

        <!-- 4大卡片 -->
        <div class="grid-hub">
          <div class="hub-card" onclick="showPage('taskPage')">
            <div class="card-icon">✅</div>
            <h3>每日 Task List</h3>
            <p>記錄運動、練琴等每日習慣進度</p>
          </div>
          <div class="hub-card" onclick="showPage('catPage')">
            <div class="card-icon">🐱</div>
            <h3>主子影音牆</h3>
            <p>記錄貓咪的日常照片與可愛影片</p>
          </div>
          <div class="hub-card" style="opacity: 0.5; cursor: default;">
            <div class="card-icon">📊</div>
            <h3>習慣數據統計</h3>
            <p>（預留模組）</p>
          </div>
          <div class="hub-card" style="opacity: 0.5; cursor: default;">
            <div class="card-icon">⚙️</div>
            <h3>管家系統設定</h3>
            <p>（預留模組）</p>
          </div>
        </div>

      </div>

      <!-- 頁面 2: Task List -->
      <div id="taskPage" class="page-view">
        <div class="page-header">
          <h2>✅ 每日任務 Task List</h2>
          <button class="btn-back" onclick="showPage('homePage')">← 返回主頁</button>
        </div>
        <div class="task-input-group">
          <input type="text" id="newTaskInput" placeholder="輸入新的每日習慣...">
          <button onclick="addTask()">新增任務</button>
        </div>
        <ul class="task-list" id="taskListContainer"></ul>
      </div>

      <!-- 頁面 3: 貓咪牆 -->
      <div id="catPage" class="page-view">
        <div class="page-header">
          <h2>🐱 貓咪照片 & 影片牆</h2>
          <button class="btn-back" onclick="showPage('homePage')">← 返回主頁</button>
        </div>
        <div class="cat-grid">
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&q=80"></div>
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&q=80"></div>
          <div class="cat-media-card"><img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&q=80"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 🔑 請在下面填入你在 Spotify Developer Dashboard 取得的 Client ID
    const SPOTIFY_CLIENT_ID = '8324dfb33f7d4fee83b146d1a1934381'; 
    const REDIRECT_URI = window.location.href.split('#')[0].split('?')[0];

    let accessToken = localStorage.getItem('spotify_access_token') || '';

    // PKCE 安全授權登入流程
    async function loginSpotify() {
      if (SPOTIFY_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
        alert('請先在 index.html 裡面填入你的 SPOTIFY_CLIENT_ID！');
        return;
      }

      const verifier = generateRandomString(128);
      const challenge = await generateCodeChallenge(verifier);
      localStorage.setItem('verifier', verifier);

      const scopes = 'user-read-private user-read-email playlist-read-private';
      const params = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: scopes,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      document.location = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    // 處理登入回傳之授權碼
    async function handleAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        const verifier = localStorage.getItem('verifier');
        const params = new URLSearchParams({
          client_id: SPOTIFY_CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        });

        try {
          const res = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
          });

          const data = await res.json();
          if (data.access_token) {
            accessToken = data.access_token;
            localStorage.setItem('spotify_access_token', accessToken);
            window.history.replaceState({}, document.title, REDIRECT_URI);
            loadUserData();
          }
        } catch (e) {
          console.error('授權失敗', e);
        }
      } else if (accessToken) {
        loadUserData();
      }
    }

    // 載入使用者名稱與歌單列表
    async function loadUserData() {
      try {
        const userRes = await fetch('https://api.spotify.com/v1/me', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (userRes.ok) {
          const userData = await userRes.json();
          document.getElementById('userStatus').innerText = `👤 ${userData.display_name}`;
          document.getElementById('loginBtn').style.display = 'none';
          fetchUserPlaylists();
        }
      } catch (err) {
        console.error('使用者資料載入失敗', err);
      }
    }

    // 讀取個人的已存歌單
    async function fetchUserPlaylists() {
      try {
        const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=10', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        const listContainer = document.getElementById('playlistsList');
        listContainer.innerHTML = '';

        if (data.items && data.items.length > 0) {
          data.items.forEach(playlist => {
            const li = document.createElement('li');
            li.className = 'item-row';
            li.innerHTML = `
              <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px;">
                📂 <strong>${playlist.name}</strong>
              </div>
              <button style="background:#1db954; color:white; border:none; padding:3px 8px; border-radius:6px; cursor:pointer; font-size:0.75rem;">播放</button>
            `;
            li.onclick = () => loadPlaylistToFrame(playlist.id);
            listContainer.appendChild(li);
          });
        } else {
          listContainer.innerHTML = '<li style="color:var(--text-muted); font-size:0.78rem; text-align:center;">找不到個人歌單</li>';
        }
      } catch (e) {
        console.error('歌單讀取失敗', e);
      }
    }

    // 關鍵字搜尋歌曲
    async function searchSpotify() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query || !accessToken) return;

      const resultsList = document.getElementById('searchResults');
      resultsList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.78rem; text-align: center;">搜尋中...</li>';

      try {
        const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=4`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        const tracks = data.tracks.items;

        resultsList.innerHTML = '';
        tracks.forEach(track => {
          const li = document.createElement('li');
          li.className = 'item-row';
          const artistName = track.artists.map(a => a.name).join(', ');
          li.innerHTML = `
            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;">
              🎵 <strong>${track.name}</strong> <span style="color: var(--text-muted); font-size: 0.75rem;">${artistName}</span>
            </div>
            <button style="background: #1db954; color: white; border: none; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;">播放</button>
          `;
          li.onclick = () => loadTrackToFrame(track.id);
          resultsList.appendChild(li);
        });
      } catch (err) {
        console.error('搜尋失敗', err);
      }
    }

    // 將歌單載入右側 iframe 播放器
    function loadPlaylistToFrame(playlistId) {
      document.getElementById('spotifyPlayer').src = `https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator`;
    }

    // 將單曲載入右側 iframe 播放器
    function loadTrackToFrame(trackId) {
      document.getElementById('spotifyPlayer').src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator`;
    }

    // 分頁切換 (歌單 / 搜尋)
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    // PKCE 安全加解密工具
    function generateRandomString(length) {
      let text = '';
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
      }
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // 任務與時間控制邏輯
    let tasks = JSON.parse(localStorage.getItem('butler_tasks')) || [
      { id: 1, text: '今日運動打卡 🏋️', completed: false },
      { id: 2, text: '練琴 30 分鐘 🎹', completed: false },
      { id: 3, text: '閱讀 20 頁書 📚', completed: false }
    ];

    const IDLE_TIMEOUT = 10 * 60 * 1000;
    let idleTimer;

    function init() {
      updateGreeting();
      renderTasks();
      updateButlerSummary();
      startClockUpdates();
      resetIdleTimer();
      handleAuthCallback();

      ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
        window.addEventListener(evt, resetIdleTimer, true);
      });
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.getElementById('ambientOverlay').classList.add('active');
      }, IDLE_TIMEOUT);
    }

    function triggerIdleNow() { document.getElementById('ambientOverlay').classList.add('active'); }
    function wakeUp() { document.getElementById('ambientOverlay').classList.remove('active'); resetIdleTimer(); }

    function startClockUpdates() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('ambientClock').innerText = now.toTimeString().split(' ')[0];
        document.getElementById('ambientDate').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      }, 1000);
    }

    function updateGreeting() {
      const hour = new Date().getHours();
      let greeting = '早安，主人 ☀️';
      if (hour >= 12 && hour < 18) greeting = '下午好，主人 ☕';
      else if (hour >= 18) greeting = '晚上好，主人 🌙';
      document.getElementById('greetingText').innerText = greeting;
    }

    function showPage(pageId) {
      document.getElementById('homePage').style.display = pageId === 'homePage' ? 'block' : 'none';
      document.getElementById('taskPage').classList.toggle('active', pageId === 'taskPage');
      document.getElementById('catPage').classList.toggle('active', pageId === 'catPage');
    }

    function renderTasks() {
      const container = document.getElementById('taskListContainer');
      container.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <span>${task.text}</span>
          <input type="checkbox" style="width:20px;height:20px;cursor:pointer;" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
        `;
        container.appendChild(li);
      });
      localStorage.setItem('butler_tasks', JSON.stringify(tasks));
      updateButlerSummary();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      renderTasks();
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      if (!input.value.trim()) return;
      tasks.push({ id: Date.now(), text: input.value.trim(), completed: false });
      input.value = '';
      renderTasks();
    }

    function updateButlerSummary() {
      const completed = tasks.filter(t => t.completed).length;
      document.getElementById('butlerSummary').innerText = `今日習慣完成進度：${completed} / ${tasks.length} 項。`;
    }

    function speakButlerSummary() {
      const text = document.getElementById('greetingText').innerText + '。' + document.getElementById('butlerSummary').innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    }

    window.onload = init;
  </script>
</body>
</html>
